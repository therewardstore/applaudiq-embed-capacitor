# Generated by friday (trs-app) once; yours to edit. Security updates only: open-pull-requests-limit 0
# turns off version updates, and GitHub still raises a PR for every advisory with a fix. Turn on
# "Dependabot security updates" in the repo settings, and add NPM_TOKEN as a Dependabot secret.
version: 2
registries:
  npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: [npmjs]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
