# Generated by friday (trs-app). PR review (manual, AI): started only by hand with a PR number,
# `trs-app ci review <pr> [--all]` or Run workflow. It reads scripts/agent/review-rubric.md from the
# ref it runs on (the default branch), gets the diff through gh and posts one COMMENT review; it never
# approves, never installs or runs the PR's code. Needs CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
name: PR review (manual, AI)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
      model:
        description: Claude model for the review (Haiku is the cheapest)
        type: choice
        default: claude-haiku-5-5
        options:
          - claude-haiku-5-5
          - claude-sonnet-5-5
          - claude-opus-5-5
          - claude-fable-5-1
      all:
        description: Review every file in the PR, not only the changed lines
        default: 'false'

concurrency:
  group: pr-review-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Only a collaborator with write access may start a review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          level="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" -q .permission)"
          case "$level" in admin|write|maintain) ;; *) echo "::error::$GITHUB_ACTOR has '$level' access; write is required"; exit 1 ;; esac
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/agent/review-rubric.md
            scripts/agent/agent.conf
      # Either secret works: an OAuth token (claude setup-token) or an API key.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A choice input: only the listed model IDs can arrive here.
          claude_args: --model ${{ inputs.model }} --max-turns 12 --allowedTools "Read,Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr review *),Bash(gh pr comment *)"
          prompt: |
            Effort: low — few tool calls, no exploration beyond the diff.
            Review pull request #${{ inputs.pr_number }} of ${{ github.repository }} against
            scripts/agent/review-rubric.md (read it first). Get the diff with
            `gh pr diff ${{ inputs.pr_number }}`${{ inputs.all == 'true' && ' and read every changed file whole' || '' }}.
            Never clone, install or run the code. Post one review with `gh pr review`: COMMENT
            (never APPROVE or REQUEST_CHANGES), body in the rubric's report shape, findings as
            inline comments on exact lines, at most 20. Nothing to say → one comment "review: nothing to fix".
