# Generated by friday (trs-app). PR quality gates. The gate policy lives in scripts/agent/agent.conf and
# gates.sh; this file only wires it to GitHub. Required checks: agent-gates, agent-gates-merged
# (ruleset fe-agent-gates, no bypass actors). pr-title keeps every PR title `<TICKET>: <Summary>`. Every job
# runs on the same pull_request events, and a manual run (`trs-app ci run`) runs the required jobs for real
# on its branch: a skipped required check counts as passed, so none is ever skipped on a PR head. The AI
# review is its own manual workflow (pr-review.yml). ci status|cancel [--force]|rerun [--all-jobs].
name: PR quality gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to retitle (empty runs the gates only)
        required: false
        default: ''

concurrency:
  group: pr-quality-gates-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # A fork's token cannot edit the PR: its author retitles it. A manual run retitles the PR it names.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/agent/lib.sh
            scripts/agent/agent.conf
            scripts/git/pr-title.sh
          sparse-checkout-cone-mode: false
      # The PR that brings the rule finds none on its base: it is titled by its own copy.
      - if: hashFiles('scripts/git/pr-title.sh') == ''
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/agent/lib.sh
            scripts/agent/agent.conf
            scripts/git/pr-title.sh
          sparse-checkout-cone-mode: false
      # The title and branch reach the shell only through env: never interpolated into the script.
      - name: 'Retitle to <TICKET>: <Summary>'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          [ -f scripts/git/pr-title.sh ] || { echo "no scripts/git/pr-title.sh on the base or the PR"; exit 0; }
          if [ -z "$PR_BRANCH" ]; then
            PR_BRANCH="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
            PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)"
          fi
          want="$(bash scripts/git/pr-title.sh "$PR_BRANCH" "$PR_TITLE")"
          if [ "$want" = "$PR_TITLE" ]; then echo "title ok: $PR_TITLE"; exit 0; fi
          echo "retitle: $PR_TITLE → $want"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$want"

  agent-gates:
    runs-on: ubuntu-latest
    # A big first PR (a lint refactor over hundreds of files) spends most of this in the code rules.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR HEAD, not the merge commit: the policy judges what the author pushed.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
      # The pnpm version comes from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # No .env on a runner: the build reads the committed example, as a fresh clone does.
      - run: '[ ! -f .env.example ] || [ -f .env ] || cp .env.example .env'
      - name: Pin the policy to the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          changed="$(git diff --name-only "$base" HEAD -- scripts/agent scripts/git .github/workflows/pr-quality-gates.yml .github/workflows/pr-review.yml)"
          [ -n "$changed" ] || exit 0
          # The PR that brings the CI contract finds no ci stage on its base: its own policy judges it.
          base_gates="$(git show "$base:scripts/agent/gates.sh" 2>/dev/null || true)"
          if ! grep -qE '(^|[|[:space:]])ci\)' <<< "$base_gates"; then
            echo "::notice title=policy-bootstrap::the base branch has no CI gate policy yet; this pull request's own policy judges it and a code owner must approve"
            exit 0
          fi
          echo "::notice title=policy-change::this pull request changes the gate policy; the base branch's policy judges it and a code owner must approve"
          git checkout "$base" -- scripts/agent scripts/git
      - name: Install gitleaks
        run: curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Gates
        env:
          FRIDAY_CI_EVENT: ${{ github.event_name }}
          FRIDAY_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          FRIDAY_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          FRIDAY_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          FRIDAY_CI_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: bash scripts/agent/gates.sh ci
      # A design system linked from a local checkout must never reach CI.
      - run: '[ ! -f scripts/ds-link.mjs ] || node scripts/ds-link.mjs status --assert-unlinked'

  agent-gates-merged:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a PR the default checkout IS the merge commit: this job proves the merged result builds,
      # because the deploy builds only after the merge. A manual run builds the branch it ran on.
      - uses: actions/checkout@v5
      # The pnpm version comes from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # No .env on a runner: the build reads the committed example, as a fresh clone does.
      - run: '[ ! -f .env.example ] || [ -f .env ] || cp .env.example .env'
      - run: pnpm build
      - run: echo "no test stage"

  # The cross-repo gates the Orbit workspace adds (contracts, records); enabled because ORBIT=1.
  orbit-gates:
    if: github.event_name == 'pull_request'
    uses: therewardstore/orbit/.github/workflows/orbit.yml@main
    secrets: inherit
