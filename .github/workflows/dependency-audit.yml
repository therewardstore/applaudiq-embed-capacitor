# Generated by friday (trs-app) — rewritten on upgrade. Runs scripts/agent/audit-check.sh on the default
# branch every Monday and by hand (Run workflow); one issue labelled dependency-audit tracks a failure.
name: Dependency audit

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    # The issue tracks the default branch: a manual run on another ref must not close or rewrite it.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # The overrides step re-resolves the lockfile once per override.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # The audit reads the lockfile only: no install, so nothing from the tree runs here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit
        id: audit
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/agent/audit-check.sh --report "$RUNNER_TEMP/audit.md"
      - name: Open or update the issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ -s "$RUNNER_TEMP/audit.md" ] || echo "Dependency audit: the audit could not run (network, registry or NPM_TOKEN)." > "$RUNNER_TEMP/audit.md"
          { cat "$RUNNER_TEMP/audit.md"; echo; echo "Run: $RUN_URL"; echo; echo "@therewardstore/devleads: fix it, or record an unfixed advisory in \`docs/AUDIT-EXCEPTIONS.md\` (docs/GATES.md → The dependency audit)."; } > "$RUNNER_TEMP/body.md"
          gh label create dependency-audit --color B60205 --description "friday's weekly dependency audit" 2>/dev/null || true
          issue="$(gh issue list --label dependency-audit --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "$issue" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "Dependency audit failed on $REF_NAME" --label dependency-audit --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close the issue
        if: steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --label dependency-audit --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Clean again: $RUN_URL"
          done
      # Overrides the tree no longer needs: each is dropped in a scratch copy, re-resolved and re-audited.
      - name: Overrides still needed
        id: overrides
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/agent/audit-check.sh --overrides --report "$RUNNER_TEMP/overrides.md"
      - name: Report removable overrides
        if: steps.overrides.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s "$RUNNER_TEMP/overrides.md" ] || echo "Dependency overrides: the check could not run (network, registry or NPM_TOKEN)." > "$RUNNER_TEMP/overrides.md"
          { cat "$RUNNER_TEMP/overrides.md"; echo; echo "Run: $RUN_URL"; } > "$RUNNER_TEMP/obody.md"
          gh label create dependency-overrides --color FBCA04 --description "friday: overrides the tree no longer needs" 2>/dev/null || true
          issue="$(gh issue list --label dependency-overrides --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue edit "$issue" --body-file "$RUNNER_TEMP/obody.md"
          else gh issue create --title "Dependency overrides to remove" --label dependency-overrides --body-file "$RUNNER_TEMP/obody.md"; fi
      - if: steps.audit.outcome == 'failure'
        run: exit 1
